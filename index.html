    );
  }
  if (type === 'PROPOSED') {
    return (
      <span className="inline-flex items-center gap-1 px-1.5 py-0.5 text-[10px] font-semibold rounded bg-[#edf5ff] text-[#0043ce] border border-[#a6c8ff]">

// --- REUSABLE CONTEXTUAL RECOMMENDATION COMPONENT ---
function ContextualRecommendationCard({ contextText, boundaryText, capability, onExplore, onDismiss }) {
  if (!capability) return null;
  return (
    <div className="bg-white border border-[#e0e0e0] border-l-4 border-l-[#0f62fe] p-4 text-xs transition-all">
      <div className="flex items-start justify-between gap-2">
        <div className="space-y-1.5 flex-1">
          <div className="flex items-center gap-1.5 text-[#525252] font-medium text-[11px]">
            <Icons.Info />
            <span>{contextText}</span>
          </div>
          <p className="text-[#161616] leading-relaxed">
            {boundaryText}
          </p>
          <div className="pt-1 flex items-center gap-2">
            <span className="font-semibold text-[#0043ce] flex items-center gap-1">
              <capability.icon />
              <span>{capability.name}</span>
            </span>
            <span className="text-[#525252] text-[11px]">— {capability.tagline}</span>
          </div>
        </div>
      </div>

      <div className="mt-3 pt-2.5 border-t border-[#f4f4f4] flex items-center gap-3">
        <button
          onClick={onExplore}
          className="px-3 py-1.5 bg-[#0f62fe] hover:bg-[#0353e9] text-white font-medium text-xs flex items-center gap-1 transition-colors"
        >
          <span>Explore setup</span>
          <Icons.ChevronRight />
        </button>
        {onDismiss && (
          <button
            onClick={onDismiss}
            className="text-xs text-[#525252] hover:text-[#161616] font-medium"
          >
            Dismiss
          </button>
        )}
      </div>

  );
}

// --- MAIN APPLICATION COMPONENT ---
function App() {
  // Global View Controls
  const [presenterMode, setPresenterMode] = useState(false);
  const [activeScenarioId, setActiveScenarioId] = useState('1');
  const [activeChannel, setActiveChannel] = useState('ui'); // 'ui' | 'sidekick' | 'bob' | 'hub'
  
  // Terraform Workspace Tab State
  const [activeTerraformTab, setActiveTerraformTab] = useState('overview'); // 'overview' | 'resources' | 'code' | 'hub'
  const [selectedResource, setSelectedResource] = useState('aws_ecs_service.payments_backend');
  
  // Sidekick State (Default Collapsed)
  const [sidekickOpen, setSidekickOpen] = useState(false);
  
  // Shared digital activation destination (full-page simulated browser handoff)
  const [activationModalOpen, setActivationModalOpen] = useState(false);
  const [activeCapabilityForModal, setActiveCapabilityForModal] = useState(ConcertCapabilities.observe);
  const [modalPath, setModalPath] = useState('trial');
  const [activationStage, setActivationStage] = useState('overview'); // overview | evaluation | submitted | setup | progress
  const [activationOrigin, setActivationOrigin] = useState('terraform');
  const [activationReason, setActivationReason] = useState('');
  const [presenterAccessScenario, setPresenterAccessScenario] = useState('auto');
  const [embeddedAgentConcept, setEmbeddedAgentConcept] = useState(false);
  const [evaluationEmail, setEvaluationEmail] = useState('');
  const [evaluationNextStep, setEvaluationNextStep] = useState('specialist');
  const [evaluationMessage, setEvaluationMessage] = useState('');
  const [evaluationConsent, setEvaluationConsent] = useState(false);
  const [evaluationError, setEvaluationError] = useState('');
  const [requestSubmitting, setRequestSubmitting] = useState(false);
  const [activationConsent, setActivationConsent] = useState(false);
  const [currentRequest, setCurrentRequest] = useState(null);

  // Simulated Activation Status for Capabilities
  const [capabilityStatuses, setCapabilityStatuses] = useState({
    observe: { activated: false, status: 'Not connected' },
    optimize: { activated: false, status: 'Not connected' },
    protect: { activated: false, status: 'Not connected' }
  });

  // Bob Chat State
  const [bobMessages, setBobMessages] = useState([
    {
      id: 1,
      sender: 'bob',
      time: '10:14 AM',
      text: "Hello! I'm Bob, connected to your **acme-prod-payments-api** Terraform workspace. How can I assist with your deployment?"
    }
  ]);
  const [bobInput, setBobInput] = useState('');
  const [isBobTyping, setIsBobTyping] = useState(false);

  // Current Scenario Helper
  const currentScenario = Scenarios[activeScenarioId];
  const currentCapability = currentScenario.capabilityKey ? ConcertCapabilities[currentScenario.capabilityKey] : null;

  // Handle Scenario Switch from Presenter Bar
  const handleSelectScenario = (scenId) => {
    setActiveScenarioId(scenId);
    const scen = Scenarios[scenId];
    if (scen.resourceTab) {
      setActiveTerraformTab(scen.resourceTab);
    }
    // Reset Bob Chat to scenario context
    setBobMessages([
      {
        id: Date.now(),
        sender: 'bob',
        time: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }),
        text: `Connected to **acme-prod-payments-api** workspace. Ready to help with Run #142 (${scen.title}).`
      }
    ]);
  };

  // Entry points converge here: product UI, passive hub, Sidekick and Bob.
  // This is a FULL-PAGE simulated IBM browser destination, not a custom Bob chat modal.
  const openActivationModal = (capObj, origin = null, explicitQuestion = null) => {
    setActiveCapabilityForModal(capObj);
    const recommendedPath = capObj.accessState === 'Already licensed' ? 'licensed' : capObj.accessState === 'Trial eligible' ? 'trial' : 'evaluation';
    setModalPath(presenterAccessScenario === 'auto' ? recommendedPath : presenterAccessScenario);
    const resolvedOrigin = origin || (activeChannel === 'bob' ? 'bob' : activeChannel === 'hub' ? 'hub' : 'terraform');
    setActivationOrigin(resolvedOrigin);
    setActivationReason(explicitQuestion || (resolvedOrigin !== 'hub' && currentScenario.capabilityKey === capObj.id ? currentScenario.customerTask : 'Exploring IBM capabilities alongside HCP Terraform')); 
    setActivationStage('overview');
    setEvaluationEmail('');
    setEvaluationMessage('');
    setEvaluationNextStep('specialist');
    setEvaluationConsent(false);
    setEvaluationError('');
    setActivationConsent(false);
    setRequestSubmitting(false);
    setCurrentRequest(null);
    setActivationModalOpen(true);
  };

  const returnToOrigin = () => {
    setActivationModalOpen(false);
    // Parent React component is retained, so Bob chat and Terraform state remain intact.
  };

  const startSelectedPath = () => {
    setEvaluationError('');
    if (modalPath === 'evaluation') setActivationStage('evaluation');
    else setActivationStage('setup');
  };

  const submitEvaluationRequest = (event) => {
    event.preventDefault();
    const validEmail = /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(evaluationEmail.trim());
    if (!validEmail) { setEvaluationError('Enter a valid work email to continue.'); return; }
    if (!evaluationConsent) { setEvaluationError('Please confirm the information-sharing consent.'); return; }
    setEvaluationError('');
    setRequestSubmitting(true);
    // Client-only demo. No network requests, no actual sales ticket.
    setTimeout(() => {
      const request = {
        reference: 'PG3-DEMO-1042',
        product: activeCapabilityForModal.shortName,
        reason: activationReason,
        email: evaluationEmail.trim(),
        nextStep: evaluationNextStep,
        message: evaluationMessage.trim()
      };
      setCurrentRequest(request);
      setCapabilityStatuses(prev => ({ ...prev, [activeCapabilityForModal.id]: { activated: false, status: 'Evaluation requested' } }));
      setRequestSubmitting(false);
      setActivationStage('submitted');
    }, 550);
  };

  const completeDigitalSetup = () => {
    const status = modalPath === 'trial' ? 'Trial requested — pending access' : 'Connection setup pending';
    setCapabilityStatuses(prev => ({ ...prev, [activeCapabilityForModal.id]: { activated: false, status } }));
    setActivationStage('progress');
  };

  // Bob Chat Handler with Explicit Tool Execution Simulation
  const handleSendBobQuery = (queryText) => {
    const textToSend = queryText || bobInput;
    if (!textToSend.trim()) return;

    const userMsg = {
      id: Date.now(),
      sender: 'user',
      time: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }),
      text: textToSend
    };

    setBobMessages(prev => [...prev, userMsg]);
    setBobInput('');
    setIsBobTyping(true);

    setTimeout(() => {
      let reply = {};
      const lower = textToSend.toLowerCase();

      if (lower.includes('performance') || lower.includes('latency') || lower.includes('response time')) {
        reply = {
          id: Date.now() + 1,
          sender: 'bob',
          time: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }),
          toolUsed: 'terraform.get_run_status(run_id="run-142")',
          toolOutput: 'status: "applied", resources: 24, target_group: "healthy"',
          text: `The infrastructure changes for Run #142 were applied successfully across all 24 AWS resources.

Terraform verifies that the ECS Fargate service and ALB targets were created with passing health probes. However, Terraform doesn't tell us whether application response times, latency, or error rates changed under traffic.

**Concert Observe (Instana)** could provide that runtime performance visibility once telemetry is configured.`,
          recommendation: ConcertCapabilities.observe
        };
      } else if (lower.includes('overprovision') || lower.includes('rightsiz') || lower.includes('too many resources') || lower.includes('resource sizing')) {
        reply = {
          id: Date.now() + 1,
          sender: 'bob',
          time: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }),
          toolUsed: 'terraform.get_resource_spec(id="aws_ecs_service.payments_backend")',
          toolOutput: 'task_def: { cpu: "4096", memory: "8192", desired_count: 6 }',
          text: `In your Terraform configuration, \`aws_ecs_service.payments_backend\` allocates **4 vCPU (4096 units)** and **8 GB RAM (8192 MB)** across 6 Fargate tasks.

Terraform maintains these declared limits, but determining whether this represents over-provisioning requires historical utilization and performance telemetry.

**Concert Optimize (Turbonomic)** evaluates live workload demand against provisioned allocations to recommend right-sizing.`,
          recommendation: ConcertCapabilities.optimize
        };
      } else if (lower.includes('vulnerabilit') || lower.includes('cve') || lower.includes('image security') || lower.includes('container image')) {
        reply = {
          id: Date.now() + 1,

            {activationStage === 'setup' && (
              <section className="bg-white border border-[#e0e0e0] p-5 md:p-6 space-y-4">
                <h2 className="text-base font-semibold">{modalPath === 'trial' ? 'Request an eligible trial' : 'Connect your existing license'}</h2>
                <p className="text-sm text-[#525252]">{modalPath === 'trial' ? 'A real deployment would check your entitlement and request an IBM trial tenant. Here you can simulate the request and see the next steps.' : 'Confirm existing product access, then follow the product-specific steps to establish a connection. Actual setup requires permissions and an available tenant.'}</p>
                <div className="border border-[#e0e0e0] p-4 space-y-3 text-xs">
                  <div className="font-semibold">{activeCapabilityForModal.shortName} · Product-specific prerequisites</div>
                  {activeCapabilityForModal.id === 'observe' && <ul className="list-disc pl-5 text-[#525252] space-y-1"><li>Obtain Instana tenant access and appropriate permissions.</li><li>Instrument supported applications and deploy Instana agents using approved methods.</li><li>Validate telemetry, traces and service discovery.</li></ul>}
                  {activeCapabilityForModal.id === 'optimize' && <ul className="list-disc pl-5 text-[#525252] space-y-1"><li>Obtain Turbonomic account access and supported target configuration.</li><li>Connect relevant workload platforms and utilization data sources.</li><li>Review generated optimization insights when data is available.</li></ul>}
                  {activeCapabilityForModal.id === 'protect' && <ul className="list-disc pl-5 text-[#525252] space-y-1"><li>Obtain Concert Platform access with adequate permissions.</li><li>Connect supported vulnerability and container-image data sources.</li><li>Review security posture after ingestion and analysis complete.</li></ul>}
                </div>
                {modalPath === 'trial' && <label className="flex items-start gap-2 text-xs text-[#525252] cursor-pointer"><input type="checkbox" checked={activationConsent} onChange={e=>setActivationConsent(e.target.checked)}/><span>I want to request a trial of {activeCapabilityForModal.shortName} and understand that this demonstration does not provision a tenant.</span></label>}
                <div className="flex flex-wrap gap-3 justify-between items-center border-t border-[#e0e0e0] pt-4"><button onClick={()=>setActivationStage('overview')} className="text-xs px-4 py-2 border border-[#8d8d8d]">Back</button><button onClick={completeDigitalSetup} disabled={modalPath==='trial' && !activationConsent} className="bg-[#0f62fe] text-white text-xs px-5 py-2.5 font-medium disabled:opacity-40">{modalPath==='trial'?'Simulate trial request':'Save connection intent'} →</button></div>
              </section>
            )}

            {activationStage === 'progress' && (
              <section className="bg-white border border-[#e0e0e0] p-5 md:p-6 space-y-4">
                <h2 className="text-base font-semibold">{modalPath === 'trial' ? 'Trial request recorded' : 'Connection preparation recorded'}</h2>
                <p className="text-sm text-[#525252]">No license has been activated, no product tenant has been provisioned and no telemetry is flowing. This is a simulated onboarding milestone.</p>
                <div className="border border-[#e0e0e0] divide-y divide-[#e0e0e0] text-xs">
                  {activeCapabilityForModal.checklist.map((item,i)=><div key={item.id} className="p-3 flex items-center justify-between gap-3"><span>{item.label}</span><span className="text-[#525252] font-medium">{modalPath==='trial' ? 'Pending trial access' : i===0 ? 'Requires verification' : 'Not started'}</span></div>)}
                </div>
                <div className="text-xs text-[#525252]">Status: {capabilityStatuses[activeCapabilityForModal.id].status}</div>
                <button onClick={returnToOrigin} className="bg-[#0f62fe] text-white text-xs px-5 py-2.5 font-medium">Return to {activationOrigin === 'bob' ? 'Bob conversation' : 'Terraform workspace'} →</button>
              </section>
            )}
          </main>
        </div>
      )}

    </div>
  );
}

// Render root
const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<App />);
  </script>
</body>
</html>
